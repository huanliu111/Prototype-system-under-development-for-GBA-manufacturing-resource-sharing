{% macro icon(name, size=20) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if name == 'grid' -%}
    <rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/>
    <rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/>
  {%- elif name == 'flask' -%}
    <path d="M9 3h6"/><path d="M10 3v6.2L4.8 18a2 2 0 0 0 1.7 3h11a2 2 0 0 0 1.7-3L14 9.2V3"/><path d="M7.2 14h9.6"/>
  {%- elif name == 'history' -%}
    <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>
  {%- elif name == 'plus' -%}
    <path d="M12 5v14M5 12h14"/>
  {%- elif name == 'book' -%}
    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16"/><path d="M8 7h8"/>
  {%- elif name == 'check' -%}
    <circle cx="12" cy="12" r="9"/><path d="m8 12 2.7 2.7L16 9.4"/>
  {%- elif name == 'menu' -%}
    <path d="M4 7h16M4 12h16M4 17h16"/>
  {%- elif name == 'logout' -%}
    <path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"/><path d="m16 16 4-4-4-4"/><path d="M20 12H9"/>
  {%- elif name == 'arrow' -%}
    <path d="M5 12h14"/><path d="m14 7 5 5-5 5"/>
  {%- elif name == 'users' -%}
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  {%- elif name == 'chart' -%}
    <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
  {%- elif name == 'download' -%}
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>
  {%- elif name == 'trash' -%}
    <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 15H6L5 6"/><path d="M10 11v6M14 11v6"/>
  {%- elif name == 'play' -%}
    <path d="m8 5 11 7-11 7z"/>
  {%- elif name == 'shield' -%}
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>
  {%- elif name == 'clock' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {%- elif name == 'layers' -%}
    <path d="m12 2 9 5-9 5-9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/>
  {%- elif name == 'spark' -%}
    <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>
    <circle cx="12" cy="12" r="3.2"/>
  {%- elif name == 'alert' -%}
    <path d="M10.3 3.5 2.2 17a2 2 0 0 0 1.7 3h16.2a2 2 0 0 0 1.7-3L13.7 3.5a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>
  {%- elif name == 'info' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/>
  {%- elif name == 'chevron' -%}
    <path d="m9 18 6-6-6-6"/>
  {%- elif name == 'external' -%}
    <path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>
  {%- endif -%}
</svg>
{%- endmacro %}
